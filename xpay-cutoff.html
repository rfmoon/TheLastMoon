<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XPay Cutoff Checker</title>
<style>
  :root{
    --bg:#0b1020; --panel:#131a2d; --panel2:#0f1628; --line:#26324d;
    --text:#eef3ff; --muted:#9eabc7; --accent:#7c9cff; --ok:#56d39b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font:14px/1.45 Arial,Helvetica,sans-serif
  }
  .wrap{max-width:1180px;margin:24px auto;padding:0 16px}
  h1{font-size:23px;margin:0 0 6px}
  .sub{color:var(--muted);margin-bottom:16px}
  .panel{
    background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:14px;margin-bottom:14px
  }
  label{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}
  input,button{font:inherit}
  input[type="file"]{
    width:100%;background:var(--panel2);color:var(--text);
    border:1px solid var(--line);border-radius:10px;padding:12px
  }
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  button{
    border:0;border-radius:9px;padding:10px 14px;
    font-weight:700;cursor:pointer
  }
  .primary{background:var(--accent);color:white}
  .secondary{background:#24314e;color:#eaf1ff}
  .danger{background:#3a2430;color:#ffd8e3}
  .cards{
    display:grid;grid-template-columns:repeat(4,1fr);
    gap:10px;margin:14px 0
  }
  .card{
    background:var(--panel2);border:1px solid var(--line);
    border-radius:12px;padding:14px
  }
  .card small{display:block;color:var(--muted);margin-bottom:4px}
  .card strong{font-size:21px}
  .ok{color:var(--ok)}
  .note{color:var(--muted);font-size:12px}
  .statusline{margin-top:9px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{
    border-bottom:1px solid var(--line);
    padding:8px 7px;text-align:left;white-space:nowrap
  }
  th{position:sticky;top:0;background:#18223a}
  .tablebox{
    max-height:430px;overflow:auto;
    border:1px solid var(--line);border-radius:10px
  }
  .empty{padding:22px;color:var(--muted);text-align:center}
  @media(max-width:800px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>XPay Cutoff Checker</h1>
  <div class="sub">
    Otomatis memakai patokan <b>PAYMENT &gt; 23:30:00</b> dan <b>STATUS = SUCCESS</b>.
  </div>

  <div class="panel">
    <label>Pilih File XPay CSV</label>
    <input id="file" type="file" accept=".csv,.txt">

    <div class="actions">
      <button class="primary" id="run">Hitung Cutoff</button>
      <button class="secondary" id="copy">Copy Data Cutoff</button>
      <button class="secondary" id="download">Download Hasil CSV</button>
      <button class="danger" id="clear">Bersihkan</button>
    </div>

    <div class="statusline" id="statusline">Belum ada file.</div>
  </div>

  <div class="cards">
    <div class="card">
      <small>Jumlah transaksi cutoff</small>
      <strong id="count">0</strong>
    </div>
    <div class="card">
      <small>Total RECORD VALUE</small>
      <strong class="ok" id="value">0</strong>
    </div>
    <div class="card">
      <small>Total RECORD FEE</small>
      <strong id="fee">0</strong>
    </div>
    <div class="card">
      <small>Nominal + Fee</small>
      <strong id="grand">0</strong>
    </div>
  </div>

  <div class="panel">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px">
      <b>Data yang masuk cutoff</b>
      <span class="note" id="range"></span>
    </div>
    <div class="tablebox" id="tablebox">
      <div class="empty">Belum ada hasil.</div>
    </div>
  </div>
</div>

<script>
const COLS = [
  "ID","RECORD DATE","RECORD VALUE","RECORD FEE","MERCHANT","MEMBER",
  "APPROVE","PAYMENT","SETTLEMENT","PARTNER ID","VENDOR ID","STATUS","TICKET"
];

const CUTOFF_SECONDS = 23 * 3600 + 30 * 60; // 23:30:00 tetap
let sourceText = "";
let sourceFileName = "";
let filteredRows = [];

function fmtNum(n){
  return Math.round(Number(n) || 0).toLocaleString("en-US");
}

function parseMoney(v){
  if(v == null) return 0;
  let s = String(v).trim();
  if(!s) return 0;

  s = s.replace(/Rp/gi,"").replace(/\s/g,"");

  // 1.500.000 -> 1500000
  if(/^-?\d{1,3}(\.\d{3})+$/.test(s)){
    s = s.replace(/\./g,"");
  }
  // 1,500,000 -> 1500000
  else if(/^-?\d{1,3}(,\d{3})+$/.test(s)){
    s = s.replace(/,/g,"");
  }
  else{
    s = s.replace(/,/g,"");
  }

  const n = Number(s.replace(/[^\d.-]/g,""));
  return Number.isFinite(n) ? n : 0;
}

function getTime(str){
  const s = String(str || "");
  let m = s.match(/T(\d{2}):(\d{2}):(\d{2})/);
  if(!m) m = s.match(/\b(\d{1,2}):(\d{2}):(\d{2})\b/);
  if(!m) return null;

  return (+m[1]) * 3600 + (+m[2]) * 60 + (+m[3]);
}

function parseCSV(text){
  text = text.replace(/^\uFEFF/,"").replace(/\r/g,"").trim();
  if(!text) return [];

  const first = text.split("\n")[0];
  const delimiter = first.includes("\t") ? "\t" : ",";

  const rows = [];
  let row = [];
  let cell = "";
  let q = false;

  for(let i = 0; i < text.length; i++){
    const c = text[i];

    if(c === '"'){
      if(q && text[i+1] === '"'){
        cell += '"';
        i++;
      }else{
        q = !q;
      }
    }else if(c === delimiter && !q){
      row.push(cell);
      cell = "";
    }else if(c === "\n" && !q){
      row.push(cell);
      rows.push(row);
      row = [];
      cell = "";
    }else{
      cell += c;
    }
  }

  row.push(cell);
  rows.push(row);

  return rows.filter(r => r.some(x => String(x).trim() !== ""));
}

function normalizeRows(rows){
  if(!rows.length) return [];

  const header = rows[0].map(x => String(x).trim().toUpperCase());
  const hasHeader =
    header.includes("RECORD VALUE") &&
    header.includes("PAYMENT") &&
    header.includes("STATUS");

  if(hasHeader){
    const map = COLS.map(c => header.indexOf(c));
    return rows.slice(1).map(r =>
      map.map(i => i >= 0 ? (r[i] ?? "") : "")
    );
  }

  return rows.map(r => {
    const out = r.slice(0,13);
    while(out.length < 13) out.push("");
    return out;
  });
}

function run(){
  if(!sourceText){
    alert("Pilih file XPay terlebih dahulu.");
    return;
  }

  const rows = normalizeRows(parseCSV(sourceText));

  filteredRows = rows.filter(r => {
    const paymentTime = getTime(r[7]);
    const status = String(r[11] || "").trim().toUpperCase();

    return (
      paymentTime !== null &&
      paymentTime > CUTOFF_SECONDS &&
      status === "SUCCESS"
    );
  });

  const totalValue = filteredRows.reduce(
    (sum,r) => sum + parseMoney(r[2]), 0
  );

  const totalFee = filteredRows.reduce(
    (sum,r) => sum + parseMoney(r[3]), 0
  );

  document.getElementById("count").textContent = fmtNum(filteredRows.length);
  document.getElementById("value").textContent = fmtNum(totalValue);
  document.getElementById("fee").textContent = fmtNum(totalFee);
  document.getElementById("grand").textContent = fmtNum(totalValue + totalFee);

  const times = filteredRows
    .map(r => ({raw:r[7], sec:getTime(r[7])}))
    .filter(x => x.sec !== null)
    .sort((a,b) => a.sec - b.sec);

  document.getElementById("range").textContent =
    times.length
      ? `${times[0].raw} s/d ${times[times.length-1].raw}`
      : "";

  document.getElementById("statusline").textContent =
    `${sourceFileName} • Dibaca ${fmtNum(rows.length)} baris • Cutoff ${fmtNum(filteredRows.length)} baris`;

  renderTable();
}

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[m]));
}

function renderTable(){
  const box = document.getElementById("tablebox");

  if(!filteredRows.length){
    box.innerHTML = '<div class="empty">Tidak ada transaksi yang memenuhi cutoff.</div>';
    return;
  }

  let h = "<table><thead><tr>";
  h += COLS.map(c => `<th>${esc(c)}</th>`).join("");
  h += "</tr></thead><tbody>";

  h += filteredRows.map(r => {
    return "<tr>" + r.map((v,i) => {
      if(i === 2 || i === 3){
        return `<td>${fmtNum(parseMoney(v))}</td>`;
      }
      return `<td>${esc(v)}</td>`;
    }).join("") + "</tr>";
  }).join("");

  h += "</tbody></table>";
  box.innerHTML = h;
}

function rowsToTSV(rows){
  const converted = rows.map(r =>
    r.map((v,i) => (i === 2 || i === 3) ? fmtNum(parseMoney(v)) : v)
  );
  return [COLS, ...converted].map(r => r.join("\t")).join("\n");
}

function csvCell(v){
  const s = String(v ?? "");
  return /[",\n]/.test(s)
    ? '"' + s.replace(/"/g,'""') + '"'
    : s;
}

function rowsToCSV(rows){
  const converted = rows.map(r =>
    r.map((v,i) => (i === 2 || i === 3) ? fmtNum(parseMoney(v)) : v)
  );

  return [COLS, ...converted]
    .map(r => r.map(csvCell).join(","))
    .join("\n");
}

document.getElementById("file").addEventListener("change", async e => {
  const f = e.target.files[0];
  if(!f) return;

  sourceFileName = f.name;
  sourceText = await f.text();

  document.getElementById("statusline").textContent =
    `${sourceFileName} siap dihitung.`;

  run();
});

document.getElementById("run").onclick = run;

document.getElementById("clear").onclick = () => {
  sourceText = "";
  sourceFileName = "";
  filteredRows = [];

  document.getElementById("file").value = "";
  document.getElementById("count").textContent = "0";
  document.getElementById("value").textContent = "0";
  document.getElementById("fee").textContent = "0";
  document.getElementById("grand").textContent = "0";
  document.getElementById("statusline").textContent = "Belum ada file.";
  document.getElementById("range").textContent = "";
  document.getElementById("tablebox").innerHTML =
    '<div class="empty">Belum ada hasil.</div>';
};

document.getElementById("copy").onclick = async () => {
  if(!filteredRows.length){
    alert("Belum ada data cutoff.");
    return;
  }

  await navigator.clipboard.writeText(rowsToTSV(filteredRows));
  alert("Data cutoff berhasil dicopy.");
};

document.getElementById("download").onclick = () => {
  if(!filteredRows.length){
    alert("Belum ada data cutoff.");
    return;
  }

  const blob = new Blob(
    ["\ufeff" + rowsToCSV(filteredRows)],
    {type:"text/csv;charset=utf-8"}
  );

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "hasil_cutoff.csv";
  a.click();

  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
</script>
</body>
</html>
