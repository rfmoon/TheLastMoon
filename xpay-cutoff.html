<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XPay Cutoff Checker</title>
<link rel="stylesheet" href="/xpay-cutoff.css?v=113.0.0">
<link rel="stylesheet" href="/mobile.css?v=112.0.0">

</head>
<body>
<div class="wrap">
  <h1>XPay Cutoff Checker</h1>
  <div class="sub">
    Otomatis memakai patokan <b>PAYMENT &gt; 23:30:00</b> dan <b>STATUS = SUCCESS</b>.
  </div>

  <div class="panel">
    <label>Pilih File XPay CSV</label>
    <input id="file" type="file" accept=".csv,.txt">

    <div class="actions">
      <button class="primary" id="run">Hitung Cutoff</button>
      <button class="secondary" id="copy">Copy Data Cutoff</button>
      <button class="secondary" id="download">Download Hasil CSV</button>
      <button class="danger" id="clear">Bersihkan</button>
    </div>

    <div class="statusline" id="statusline">Belum ada file.</div>
  </div>

  <div class="cards">
    <div class="card">
      <small>Jumlah transaksi cutoff</small>
      <strong id="count">0</strong>
    </div>
    <div class="card">
      <small>Total RECORD VALUE</small>
      <strong class="ok" id="value">0</strong>
    </div>
    <div class="card">
      <small>Total RECORD FEE</small>
      <strong id="fee">0</strong>
    </div>
    <div class="card">
      <small>Nominal + Fee</small>
      <strong id="grand">0</strong>
    </div>
  </div>

  <div class="panel">
    <div class="table-head">
      <b>Data yang masuk cutoff</b>
      <span class="note" id="range"></span>
    </div>
    <div class="tablebox" id="tablebox">
      <div class="empty">Belum ada hasil.</div>
    </div>
  </div>
</div>


  <script src="/xpay-cutoff.js?v=113.0.0"></script>
</body>
</html>
