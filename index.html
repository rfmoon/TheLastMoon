<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1020">
  <title>TheLastMoon — Liquid Glass</title>
  <link rel="stylesheet" href="/styles.css?v=57.0.0">
</head>
<body>
  <img id="siteBackground" class="site-background" alt="" referrerpolicy="no-referrer">
  <div class="background-overlay"></div>
  <div class="liquid-light light-one"></div>
  <div class="liquid-light light-two"></div>
  <div class="liquid-light light-three"></div>

  <main id="loginView" class="login-view">
    <section class="login-box liquid-glass">
      <form id="loginForm" class="login-form">
        <div class="login-input-wrap">
          <span class="input-orb">◎</span>
          <input id="loginUsername" autocomplete="username" maxlength="40"
                 placeholder="Username" aria-label="Username" required>
        </div>

        <div class="login-input-wrap">
          <span class="input-orb">◆</span>
          <input id="loginPassword" type="password" autocomplete="current-password"
                 maxlength="128" placeholder="Password" aria-label="Password" required>
          <button class="password-toggle" type="button"
                  data-toggle-password="loginPassword" aria-label="Tampilkan password">◉</button>
        </div>

        <div id="loginMessage" class="message hidden"></div>

        <button id="loginButton" class="login-button" type="submit">LOGIN</button>
      </form>
    </section>
  </main>

  <div id="appView" class="app-view hidden">
    <aside id="sidebar" class="sidebar liquid-glass">
      <div class="side-head">
        <div class="brand-mark">◐</div>
        <div class="brand-text">
          <strong>TheLastMoon</strong>
          <small>Control Center</small>
        </div>
        <button id="closeSidebar" class="icon-btn mobile-only" type="button">×</button>
      </div>

      <div class="side-caption">WORKSPACE</div>
      <nav id="menuList" class="menu-list"></nav>

      <div class="side-bottom">
        <div id="sideUser"></div>
        <button id="logoutButton" class="btn btn-ghost btn-full" type="button">Keluar dari panel</button>
      </div>
    </aside>

    <div id="sidebarOverlay" class="sidebar-overlay hidden"></div>

    <section class="app-main">
      <header class="topbar liquid-glass">
        <div class="topbar-left">
          <button id="openSidebar" class="icon-btn mobile-only" type="button">☰</button>
          <div>
            <span class="eyebrow">THELASTMOON WORKSPACE</span>
            <h2 id="pageTitle">Dashboard</h2>
          </div>
        </div>

        <div class="topbar-right">
          <span class="live-pill"><i></i>System Online</span>
          <button id="accountButton" class="account-chip" type="button"></button>
        </div>
      </header>

      <div id="pageContent" class="page-content"></div>
    </section>
  </div>

  <div id="userModal" class="modal hidden">
    <section class="modal-card liquid-glass wide">
      <header class="modal-head">
        <div><span class="eyebrow">USER MANAGEMENT</span><h3 id="userModalTitle">Tambah akun</h3></div>
        <button class="icon-btn" type="button" data-close-modal="userModal">×</button>
      </header>
      <form id="userForm">
        <input id="editUserId" type="hidden">
        <div class="form-grid">
          <label>Username<input id="userUsername" minlength="3" maxlength="40" placeholder="contoh: operator01" required></label>
          <label>Password <small id="passwordHint" class="muted"></small><input id="userPassword" type="password" minlength="6" maxlength="128" placeholder="minimal 6 karakter"></label>
        </div>
        <div class="switch-row">
          <div><strong>Status akun</strong><small>Akun nonaktif tidak dapat login.</small></div>
          <label class="switch"><input id="userActive" type="checkbox" checked><span></span></label>
        </div>
        <section class="permission-box">
          <header>
            <div><strong>Hak akses menu</strong><small>Pilih menu yang dapat dibuka akun ini.</small></div>
            <div><button id="selectAllPermissions" class="link-btn" type="button">Pilih semua</button><button id="clearPermissions" class="link-btn" type="button">Kosongkan</button></div>
          </header>
          <div id="permissionGrid" class="permission-grid"></div>
        </section>
        <div id="userMessage" class="message hidden"></div>
        <footer class="modal-actions">
          <button class="btn btn-secondary" type="button" data-close-modal="userModal">Batal</button>
          <button id="saveUserButton" class="btn btn-primary" type="submit">Simpan akun</button>
        </footer>
      </form>
    </section>
  </div>

  <div id="passwordModal" class="modal hidden">
    <section class="modal-card liquid-glass">
      <header class="modal-head">
        <div><span class="eyebrow">ACCOUNT SECURITY</span><h3>Ganti password</h3></div>
        <button class="icon-btn" type="button" data-close-modal="passwordModal">×</button>
      </header>
      <form id="passwordForm">
        <label>Password sekarang<input id="currentPassword" type="password" required></label>
        <label>Password baru<input id="newPassword" type="password" minlength="8" maxlength="128" required></label>
        <label>Ulangi password baru<input id="confirmPassword" type="password" minlength="8" maxlength="128" required></label>
        <div id="passwordMessage" class="message hidden"></div>
        <footer class="modal-actions">
          <button class="btn btn-secondary" type="button" data-close-modal="passwordModal">Batal</button>
          <button class="btn btn-primary" type="submit">Ubah password</button>
        </footer>
      </form>
    </section>
  </div>

  <div id="confirmModal" class="modal hidden">
    <section class="modal-card liquid-glass compact">
      <div class="confirm-symbol">!</div>
      <h3 id="confirmTitle">Hapus akun?</h3>
      <p id="confirmText" class="muted"></p>
      <footer class="modal-actions centered">
        <button class="btn btn-secondary" type="button" data-close-modal="confirmModal">Batal</button>
        <button id="confirmButton" class="btn btn-danger" type="button">Hapus</button>
      </footer>
    </section>
  </div>

  <div id="toastArea" class="toast-area"></div>
  <script src="/app.js?v=57.0.0" defer></script>
</body>
</html>
